name: CI

# Every push, on any branch, plus manual runs from the Actions tab.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-native-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      - run: pio test -e native

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [peg_esp32, desk_esp32, wall_esp32]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Per-board key: each job caches the toolchain plus its own libraries.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio==6.2.0
      # No credential headers here (they're gitignored): this is a release-style
      # build that reads WiFi/MQTT/OTA settings from the board's NVS storage, so
      # it also checks that the firmware builds without any secrets.
      - name: Check no credential headers are present
        run: test ! -e src/config/WifiCreds.h && test ! -e src/config/Mqtt.h
      - run: pio run -e ${{ matrix.env }}
